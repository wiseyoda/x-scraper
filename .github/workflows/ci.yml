name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Build before lint: typescript-eslint's projectService resolves
      # cross-package types via project references, which expect each
      # package's dist/index.d.ts to exist. On a fresh checkout the dist
      # dirs are absent, so any cross-package import (e.g. @x-scraper/digest
      # from cli/commands/schedule.ts) degrades to `error`/`any` and
      # triggers no-unsafe-* rule errors that don't reproduce locally once
      # dist is built. Build first to avoid those false-negatives.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Circular dependency check
        run: pnpm circular
